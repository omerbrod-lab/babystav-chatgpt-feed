name: Update Baby Stav product feed
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [feed.py, .github/workflows/update-feed.yml]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: babystav-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download, convert and validate
        run: python3 feed.py
      - name: Publish validated CSV
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > docs/updated.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/products.csv docs/updated.txt
          git commit -m 'Update product feed'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy current feed to Pages
        id: deployment
        uses: actions/deploy-pages@v4
