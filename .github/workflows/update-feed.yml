name: Update Baby Stav product feed
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [feed.py, .github/workflows/update-feed.yml]
permissions:
  contents: write
concurrency:
  group: babystav-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download, convert and validate
        run: python3 feed.py
      - name: Publish validated CSV
        run: |
          if ! git diff --quiet -- docs/products.csv || ! git ls-files --error-unmatch docs/products.csv >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/products.csv
            git commit -m 'Update product feed'
            git push
          fi
